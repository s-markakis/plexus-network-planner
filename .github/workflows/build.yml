# Build Plexus installers natively on each OS: macOS (.dmg/.zip), Windows (.exe
# nsis), Linux (.AppImage/.deb). Cross-building these from one host is unreliable
# (Windows needs wine+mono, Linux needs dpkg/fakeroot), so each target builds on
# its own runner. Manual + tag-triggered to keep private-repo minutes down —
# macOS runners bill ~10x, so this does not run on every push.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vitest + tsc — the same gate the pre-push hook runs locally.
      - run: npm run verify
      - name: Build installers
        run: npm run app:build
        env:
          # No signing identity in CI; electron-builder would otherwise try to
          # auto-discover one and fail on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: plexus-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
