name: Deploy demo to GitHub Pages

# The production build is fully static (relative paths, no backend), so the
# live demo is just dist/ served from Pages. Deploys on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; later pushes supersede queued ones.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle self-hosted fonts
        run: npm run bundle:fonts

      - name: Build
        run: npm run build

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
