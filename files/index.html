<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<!-- Content Security Policy. Permissive on inline script/style (the app inlines
     its bundle) but blocks remote script injection, plugins, frame embedding
     and base-tag hijacking. fonts.* allow the Google Fonts webfonts; img http(s)
     allows pasted device-photo URLs; blob: covers the PDF-import worker. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"/>
<title>Plexus — Network Site Planner</title>
<link rel="stylesheet" href="fonts.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="shell">
  <!-- ROW 1 — Meta & actions: branding, file ops, undo/redo, commit actions, help -->
  <div class="topbar topbar-meta">
    <span class="brand" id="brand-lbl">Plexus Planner</span>
    <div class="mode-switch" role="tablist" aria-label="Workspace mode">
      <button class="mode-tab active" data-action="set-uimode" data-arg="design" data-uimode-btn="design" title="Plan the network">◳ Design</button>
      <button class="mode-tab" data-action="set-uimode" data-arg="simulate" data-uimode-btn="simulate" title="Practice on a simulated copy — no real devices">⇄ Simulate</button>
      <button class="mode-tab mode-tab-operate" data-action="set-uimode" data-arg="operate" data-uimode-btn="operate" id="mode-operate" title="Connect to real devices (desktop)" style="display:none">⚡ Operate</button>
    </div>
    <div class="tsep"></div>
    <button class="btn" data-action="new-project" title="Start a fresh project">✦ New</button>
    <button class="btn" data-action="open-upload">↑ Upload Map</button>
    <input type="file" id="file-up" accept="image/*,.svg,.pdf,application/pdf" style="display:none" data-change-action="upload-map"/>
    <span class="toolgroup" data-modes="design">
    <button class="btn" data-action="open-svg" title="Import walls from an SVG floor-plan">↺ Walls SVG</button>
    <input type="file" id="svg-up" accept=".svg,image/svg+xml" style="display:none" data-change-action="import-svg-walls"/>
    <button class="btn" data-action="open-dxf" title="Import walls from a DXF (LINE/POLYLINE)">↺ DXF</button>
    <input type="file" id="dxf-up" accept=".dxf" style="display:none" data-change-action="import-dxf-walls"/>
    <button class="btn" data-action="detect-walls" title="Auto-detect walls from the floor-plan image (Hough transform)">▦ Detect walls</button>
    <button class="btn" data-action="open-esx" title="Import an Ekahau project (.esx)">⇊ ESX</button>
    <input type="file" id="esx-up" accept=".esx,.zip" style="display:none" data-change-action="import-esx"/>
    <button class="btn" data-action="open-survey" title="Import RSSI survey samples from a CSV">↺ Survey CSV</button>
    <input type="file" id="survey-up" accept=".csv,text/csv" style="display:none" data-change-action="import-survey-csv"/>
    </span>
    <button class="btn" data-action="save">💾 Save</button>
    <button class="btn" data-action="open-load">📂 Load</button>
    <button class="btn" data-action="share-link" title="Copy a shareable URL of the current project (images not included)">🔗 Share</button>
    <input type="file" id="load-up" accept=".json" style="display:none" data-change-action="load-project"/>
    <div class="tsep"></div>
    <button class="btn btn-ghost" id="btn-undo" data-action="undo" title="Undo (Ctrl+Z)" disabled>↩ Undo</button>
    <button class="btn btn-ghost" id="btn-redo" data-action="redo" title="Redo (Ctrl+Y)" disabled>↪ Redo</button>

    <div class="topbar-spacer"></div>

    <div class="status"><span class="sdot"></span><span id="ap-cnt">0</span> APs · <span id="fl-cnt">0</span> floors</div>
    <div class="tsep"></div>
    <button class="btn btn-primary" id="btn-pres" data-action="toggle-present" title="Presentation mode (P)">▶ Present</button>
    <span class="toolgroup" data-modes="design"><span class="dropdown">
    <button class="btn btn-primary" data-action="toggle-menu" data-arg="export-menu" title="Exports, reports & deliverables">↓ Export ▾</button>
    <div class="dropdown-menu" id="export-menu">
      <button class="btn" data-action="export" title="Export HTML report">↓ HTML report</button>
      <button class="btn" data-action="pdf" title="Export PDF">⎙ PDF</button>
      <button class="btn" data-action="export-bom" title="Export Bill of Materials (CSV)">≡ Bill of Materials</button>
      <button class="btn" data-action="export-cables" title="Export cable schedule (CSV)">∼ Cable schedule</button>
      <button class="btn" data-action="install-sheets" title="Per-AP install sheets PDF">⎙ Install sheets</button>
      <button class="btn" data-action="show-inventory" title="As-built inventory, rollout status & organization tools">▤ Inventory</button>
      <button class="btn" data-action="handover-pack" title="Zip the HTML summary + every CSV deliverable">⇩ Handover pack</button>
      <button class="btn" data-action="export-esx" title="Export the project as an Ekahau .esx (best-effort)">⇈ Ekahau .esx</button>
    </div>
    </span></span>
    <button class="btn" id="btn-unifi" data-action="show-unifi" title="Pull as-built data from / push the channel plan to a UniFi controller (desktop app)" style="display:none">⇅ UniFi</button>
    <button class="btn btn-icon-only" id="btn-theme" data-action="toggle-theme" title="Toggle dark mode" aria-label="Toggle theme">☾</button>
    <button class="btn btn-icon-only" data-action="show-revisions" title="Project revisions" aria-label="Revisions">⟲</button>
    <button class="btn btn-icon-only" data-action="show-plugins" title="Custom vendor catalogs" aria-label="Plugins">+</button>
    <button class="btn btn-icon-only" data-action="show-settings" title="Project settings" aria-label="Settings">⚙</button>
    <button class="btn btn-icon-only" data-action="show-help" title="Keyboard shortcuts (?)" aria-label="Help">?</button>
  </div>

  <!-- ROW 2 — Workspace tools: modes (icon-only strip), view toggles, zoom, scale -->
  <div class="topbar topbar-tools">
    <!-- Mode toolstrip (icon-only) -->
    <div class="toolstrip" role="toolbar" aria-label="Drawing tools">
      <button class="btn-tool active" id="btn-add" data-action="set-mode" data-arg="add" data-modes="design" title="Add AP (A)" aria-label="Add AP">+</button>
      <button class="btn-tool" id="btn-sel" data-action="set-mode" data-arg="sel" title="Select (S)" aria-label="Select">↖</button>
      <button class="btn-tool" id="btn-dz" data-action="set-mode" data-arg="dz" data-modes="design" title="Dead Zone (D)" aria-label="Dead Zone">⚠</button>
      <button class="btn-tool" id="btn-sw" data-action="set-mode" data-arg="sw" data-modes="design simulate operate" title="Switch/Router (W)" aria-label="Switch / Router">⊞</button>
      <button class="btn-tool" id="btn-cam" data-action="set-mode" data-arg="cam" data-modes="design" title="Camera (C)" aria-label="Camera">◉</button>
      <button class="btn-tool" id="btn-client" data-action="set-mode" data-arg="client" data-modes="simulate" title="Wireless client (K)" aria-label="Wireless client">📱</button>
      <button class="btn-tool" id="btn-ruler" data-action="set-mode" data-arg="ruler" data-modes="design" title="Ruler (R)" aria-label="Ruler">↔</button>
      <button class="btn-tool" id="btn-wall" data-action="set-mode" data-arg="wall" data-modes="design" title="Wall (L)" aria-label="Wall">▌</button>
      <button class="btn-tool" id="btn-anno" data-action="set-mode" data-arg="anno" data-modes="design" title="Annotation (N)" aria-label="Annotation">✎</button>
      <button class="btn-tool" id="btn-sim" data-action="set-mode" data-arg="sim" data-modes="simulate" title="Packet simulation (M)" aria-label="Packet simulation">⇄</button>
      <button class="btn-tool" id="btn-survey" data-action="set-mode" data-arg="survey" data-modes="design" title="Live WiFi survey — click the map where you stand (desktop app)" aria-label="Live survey" style="display:none">📶</button>
    </div>
    <div class="anno-sub-bar" id="anno-sub-bar" style="display:none" role="group" aria-label="Annotation type">
      <button class="btn-tool active" data-action="anno-sub" data-arg="text" data-anno-sub="text" title="Text label" aria-label="Text label">T</button>
      <button class="btn-tool" data-action="anno-sub" data-arg="arrow" data-anno-sub="arrow" title="Arrow" aria-label="Arrow">→</button>
      <button class="btn-tool" data-action="anno-sub" data-arg="dim" data-anno-sub="dim" title="Dimension line" aria-label="Dimension line">↔</button>
    </div>
    <span class="toolgroup" data-modes="design">
    <div class="tsep"></div>

    <!-- View toggles → collapsed into a Layers menu -->
    <span class="dropdown">
    <button class="btn" data-action="toggle-menu" data-arg="layers-menu" title="Map layers">▤ Layers ▾</button>
    <div class="dropdown-menu" id="layers-menu">
    <button class="toggle active" id="btn-cov" data-action="toggle-coverage" title="Show/hide coverage rings (V)">
      <span class="toggle-lbl">Coverage</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-ol" data-action="toggle-ol" title="Show coverage overlaps (O)">
      <span class="toggle-lbl">Overlaps</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-heat" data-action="toggle-heat" title="Signal heatmap (H)">
      <span class="toggle-lbl">Heatmap</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-grid" data-action="toggle-grid" title="Snap to grid (G)">
      <span class="toggle-lbl">Grid</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-cables" data-action="toggle-cables" title="Show cable runs to switches">
      <span class="toggle-lbl">Cables</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-roaming" data-action="toggle-roaming" title="Show roaming overlap layer">
      <span class="toggle-lbl">Roaming</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="btn-vlan" data-action="toggle-vlan-colors" title="Colour devices by VLAN">
      <span class="toggle-lbl">VLAN colors</span>
      <span class="toggle-switch" aria-hidden="true"></span>
    </button>
    <div class="heat-mode-cluster" role="group" aria-label="Heatmap display">
      <button class="heat-pill" data-action="cycle-heatmap-mode" id="heat-mode-pill" title="Cycle heatmap metric" aria-label="Cycle heatmap metric">RSSI (dBm)</button>
      <button class="heat-pill" data-action="cycle-heatmap-band" id="heat-band-pill" title="Cycle heatmap band filter" aria-label="Cycle heatmap band filter">All</button>
    </div>
    </div>
    </span>
    <div class="tsep"></div>
    <button class="btn" data-action="auto-place" title="Auto-place APs to reach target coverage">✦ Auto-place</button>
    <button class="btn" data-action="auto-channel" title="Auto-assign channels (graph coloring)">⌁ Auto-channel</button>
    <button class="btn" data-action="auto-power" title="Auto-tune per-AP Tx power">⌁ Auto-power</button>
    <button class="btn" data-action="show-poe" title="PoE budget summary">⚡ PoE</button>
    <button class="btn" data-action="auto-assign-sw" title="Assign APs/cameras to nearest switch">⚯ Auto-cable</button>
    <button class="btn" data-action="show-topology" title="Switch uplink tree & port usage">⊟ Topology</button>
    <button class="btn" data-action="show-validation" title="Validate network wiring & PoE">✓ Validate</button>
    </span>

    <div class="topbar-spacer"></div>

    <!-- Scale (moved up from floor row) -->
    <div class="scale-cluster">
      <span class="scale-lbl">SCALE</span>
      <input id="scale-m" type="number" min="1" value="100" class="scale-in" data-input-action="update-scale"/>
      <span class="scale-lbl">m/100px</span>
      <button class="btn btn-ghost" data-action="calibrate-scale" title="Set scale by measuring a known dimension on the plan">⇲ Calibrate</button>
      <div class="tsep"></div>
      <span class="scale-lbl">COV</span>
      <span id="cov-pct" class="cov-val">—</span>
    </div>
    <div class="tsep"></div>

    <!-- Zoom -->
    <div class="zoom-grp">
      <button class="zbtn" data-action="zoom-out" title="Zoom out (−)">−</button>
      <span class="zval" id="zval">100%</span>
      <button class="zbtn" data-action="zoom-in" title="Zoom in (+)">+</button>
      <button class="zbtn zbtn-fit" data-action="zoom-fit" title="Fit to screen (0)">FIT</button>
    </div>
  </div>

  <!-- ROW 3 — Floor tabs only (scale moved to row 2) -->
  <div class="topbar floor-row">
    <div class="floor-tabs" id="floor-tabs"></div>
    <button class="ftab-add" data-action="add-floor" title="Add floor">+</button>
  </div>

  <div class="workspace">
    <!-- Left list -->
    <div class="sidebar" id="left-sb">
      <div class="sb-head sb-head-counters" id="sb-counters"></div>
      <div class="sb-search-row">
        <input type="text" id="sb-search" class="sb-search" placeholder="Search items…" data-input-action="sb-search" autocomplete="off"/>
        <button class="sb-search-clear" id="sb-search-clear" data-action="sb-search-clear" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <div class="sb-status-row">
        <select id="sb-status" class="sb-status" data-input-action="status-filter" title="Filter devices by install status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="planned">Planned</option>
          <option value="ordered">Ordered</option>
          <option value="installed">Installed</option>
          <option value="tested">Tested</option>
          <option value="live">Live</option>
        </select>
      </div>
      <div class="sb-scroll" id="left-list"></div>
      <div class="sb-resize-handle" id="sb-resize-handle" aria-label="Resize sidebar"></div>
    </div>

    <!-- Map -->
    <div class="map-area" id="map-area">
      <div id="empty-state">
        <div class="es-line">Upload a floor plan to begin</div>
        <div class="es-sub">Click <strong>↑ Upload Map</strong> above · Press <kbd>?</kbd> for shortcuts</div>
        <button class="btn btn-primary es-sample" data-action="load-sample" title="Open a ready-made office plan with APs, cameras, walls and a switch">▶ Load sample project</button>
      </div>
      <div class="hint-bar" id="hint-bar" role="status" aria-live="polite">Click map to place an AP</div>
      <div class="sim-panel" id="sim-panel" style="display:none">
        <div class="sim-panel-head">Packet Simulation</div>
        <div class="sim-panel-body" id="sim-panel-body"></div>
      </div>
      <div class="cli-panel" id="cli-panel" style="display:none">
        <div class="cli-panel-head"><span id="cli-panel-title">Console</span><button class="cli-close" data-action="close-console" title="Close console" aria-label="Close console">×</button></div>
        <div class="cli-panel-body" id="cli-panel-body"></div>
      </div>
      <div id="vp" class="cur-cross">
        <div id="cv">
          <img id="mi" src="" alt="Map"/>
          <canvas id="heat-canvas"></canvas>
          <svg id="sl" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="gf"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <marker id="anno-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
              </marker>
            </defs>
            <g id="grid-layer"></g>
            <g id="heat-layer"></g>
            <g id="roaming-layer"></g>
            <g id="ol-layer"></g>
            <g id="wall-layer"></g>
            <g id="cable-layer"></g>
            <g id="sw-layer"></g>
            <g id="ap-layer"></g>
            <g id="cam-layer"></g>
            <g id="client-layer"></g>
            <g id="dz-layer"></g>
            <g id="ch-overlap-layer"></g>
            <g id="sample-layer"></g>
            <g id="anno-layer"></g>
            <g id="anno-preview-layer"></g>
            <g id="ruler-layer"></g>
            <g id="marquee-layer"></g>
          </svg>
        </div>
      </div>
      <div class="map-leg">
        <div class="leg-i"><div class="leg-dot"></div>AP</div>
        <div class="leg-i"><div class="leg-ring"></div>Coverage</div>
        <div class="leg-i" id="leg-ol" style="display:none"><div class="leg-ol"></div>Overlap</div>
        <div class="leg-i">⚠ Dead Zone</div>
        <div class="leg-i">⊞ Switch</div>
        <span class="leg-vlans" id="leg-vlans"></span>
        <span class="leg-brand">Plexus</span>
      </div>
      <div id="scale-bar" style="display:none">
        <div class="sbar-line" id="sbar-line"></div>
        <div class="sbar-txt" id="sbar-txt"></div>
      </div>
      <div id="ap-stick-readout" style="display:none" aria-live="polite"></div>
    </div>

    <!-- Right panel -->
    <div class="sidebar right" id="right-sb">
      <div class="sb-head" id="rp-head">Properties</div>
      <div class="rp-body" id="rp-body"><div class="rp-empty"><div class="rp-empty-icon">◎</div><div class="rp-empty-txt">Select an item<br>to edit properties</div></div></div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="ctx-menu" role="menu"></div>
<div id="mbg"><div id="mdl" role="dialog" aria-modal="true" aria-labelledby="mdl-title">
  <div class="mdl-title" id="mdl-title">Confirm</div>
  <div class="mdl-body" id="mdl-body"></div>
  <div class="mdl-actions">
    <button class="btn" data-action="modal-close">Cancel</button>
    <button class="btn danger" id="mdl-ok" data-action="modal-ok">OK</button>
  </div>
</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
